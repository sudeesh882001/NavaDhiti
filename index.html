<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navadhiti Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
  body {
  background: #f0f4f8;
  font-family: 'Inter', sans-serif;
  color: #333;
  padding: 20px;
}

.navbar {
  background: linear-gradient(to right, #035c82, #04a0c7);
}

.btn-gradient {
  background: linear-gradient(to right, #04a0c7, #0497b7);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-weight: 500;
  transition: background 0.3s;
}

.btn-gradient:hover {
  background: linear-gradient(to right, #0497b7, #04a0c7);
}

input.form-control,
select.form-select {
  border-radius: 10px;
  padding: 10px;
}

.card {
  border-radius: 16px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}

.table {
  background: white;
  color: #333;
}

.table thead {
  background-color: #035c82;
  color: white;
}

.modal-content {
  border-radius: 12px;
}

h2, h3, h4 {
  color: #035c82;
}

button.btn {
  font-size: 14px;
}

  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Navadhiti Dashboard</a>
      <button class="btn btn-gradient" data-bs-toggle="modal" data-bs-target="#loginModal">Login</button>
    </div>
  </nav>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Login</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="email" id="loginEmail" class="form-control mb-2" placeholder="Email" />
          <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password" />
          <button class="btn btn-gradient w-100" onclick="login()">Login</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Admin Section -->
  <div id="adminSection" style="display:none">
    <h2 class="mt-4">Onboard Employee</h2>
    <div class="row g-3">
      <input type="hidden" id="editId" />
      <div class="col-md-3">
        <input type="text" id="fname" class="form-control" placeholder="First Name" />
      </div>
      <div class="col-md-3">
        <input type="text" id="lname" class="form-control" placeholder="Last Name" />
      </div>
      <div class="col-md-3">
        <input type="date" id="dob" class="form-control" onchange="calculateAge()" />
      </div>
      <div class="col-md-3">
        <input type="text" id="age" class="form-control" readonly />
      </div>
      <div class="col-md-3">
        <select id="role" class="form-select">
          <option value="">Select Role</option>
          <option>Development</option>
          <option>Testing</option>
          <option>HR</option>
          <option>UI/UX</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-gradient" onclick="submitForm()">Submit</button>
      </div>
    </div>

    <hr class="my-4" />

    <h4>Search Employee</h4>
    <input type="text" id="searchBox" class="form-control mb-3" placeholder="Search by name or role" oninput="searchEmployee()" />

    <button class="btn btn-gradient mb-3" onclick="fetchEmployees()">Get All Employees</button>
    <div class="table-responsive">
      <table class="table table-bordered table-hover text-white" id="employeeTable">
        <thead class="table-dark">
          <tr>
            <th>Emp ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Age</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- Employee Section -->
<div id="employeeSection" style="display: none;">
  <h3 class="mt-4">Welcome to your profile</h3>
  <div class="card bg-light text-dark mt-3">
    <div class="card-body">
      <p><strong>Name:</strong> <span id="empName"></span></p>
      <p><strong>Email:</strong> <span id="empEmail"></span></p>
      <p><strong>Role:</strong> <span id="empRole"></span></p>
      <p><strong>Age:</strong> <span id="empAge"></span></p>
    </div>
  </div>
</div>


  <!-- Delete Confirmation -->
  <div class="modal fade" id="confirmDeleteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirm Delete</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Are you sure you want to delete this employee?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger" id="deleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "http://localhost:3002";
    let deleteId = null;

    function calculateAge() {
      const dob = new Date(document.getElementById("dob").value);
      const age = new Date().getFullYear() - dob.getFullYear();
      document.getElementById("age").value = age;
    }

    function generateCustomId() {
      return "EMP" + Math.floor(1000 + Math.random() * 9000);
    }

    async function login() {
      const email = document.getElementById("loginEmail").value;
      const password = document.getElementById("loginPassword").value;

      const res = await fetch(`${API}/users?email=${email}&password=${password}`);
      const users = await res.json();

      if (!users.length) return showPopup("Invalid credentials");

      const user = users[0];

      if (user.userType === "admin") {
        document.getElementById("adminSection").style.display = "block";
        fetchEmployees();
      } else if (user.userType === "employee") {
        document.getElementById("employeeSection").style.display = "block";
        document.getElementById("empName").innerText = `${user.fname} ${user.lname}`;
        document.getElementById("empEmail").innerText = user.email;
        document.getElementById("empRole").innerText = user.designation;
        document.getElementById("empAge").innerText = user.age;
      } else {
        return showPopup("Unauthorized user type");
      }

      bootstrap.Modal.getInstance(document.getElementById("loginModal")).hide();
    }

    async function submitForm() {
      const id = document.getElementById("editId").value;
      const fname = document.getElementById("fname").value.trim();
      const lname = document.getElementById("lname").value.trim();
      const dob = document.getElementById("dob").value;
      const age = document.getElementById("age").value;
      const role = document.getElementById("role").value;

      if (!fname || !lname || !dob || !age || !role) return showPopup("Fill all fields");

      if (id) {
        await fetch(`${API}/users/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ fname, lname, dob, age, role })
        });
        showPopup("Employee updated successfully");
      } else {
        const empId = generateCustomId();
        const email = `${fname.toLowerCase()}@navadhiti.com`;
        const password = Math.random().toString(36).slice(-8);
        const onboardedOn = new Date().toISOString().split("T")[0];

        await fetch(`${API}/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ empId, fname, lname, dob, age, role, email, password, onboardedOn, userType: "employee" })
        });
        showPopup("Employee onboarded\nEmail: " + email + "\nPassword: " + password);
      }
      clearForm();
      fetchEmployees();
    }

    function clearForm() {
      document.getElementById("editId").value = "";
      document.getElementById("fname").value = "";
      document.getElementById("lname").value = "";
      document.getElementById("dob").value = "";
      document.getElementById("age").value = "";
      document.getElementById("role").value = "";
    }

    async function fetchEmployees() {
      const res = await fetch(`${API}/users?userType=employee`);
      const data = await res.json();
      const tbody = document.querySelector("#employeeTable tbody");
      tbody.innerHTML = data.map(emp => `
        <tr>
          <td>${emp.empId}</td>
          <td>${emp.fname} ${emp.lname}</td>
          <td>${emp.email}</td>
          <td>${emp.designation}</td>
          <td>${emp.age}</td>
          <td>
            <button class='btn btn-warning btn-sm me-1' onclick='editEmployee("${emp.id}")'>Edit</button>
            <button class='btn btn-danger btn-sm' onclick='confirmDelete("${emp.id}")'>Delete</button>
          </td>
        </tr>`).join("");
    }

    async function editEmployee(id) {
      const res = await fetch(`${API}/users/${id}`);
      const emp = await res.json();
      document.getElementById("editId").value = emp.id;
      document.getElementById("fname").value = emp.fname;
      document.getElementById("lname").value = emp.lname;
      document.getElementById("dob").value = emp.dob;
      document.getElementById("age").value = emp.age;
      document.getElementById("role").value = emp.designation;
    }

    function confirmDelete(id) {
      deleteId = id;
      new bootstrap.Modal(document.getElementById("confirmDeleteModal")).show();
    }

    document.getElementById("deleteBtn").addEventListener("click", async () => {
      if (deleteId) {
        await fetch(`${API}/users/${deleteId}`, { method: "DELETE" });
        fetchEmployees();
        bootstrap.Modal.getInstance(document.getElementById("confirmDeleteModal")).hide();
        deleteId = null;
        showPopup("Deleted successfully");
      }
    });

    async function searchEmployee() {
      const query = document.getElementById("searchBox").value.toLowerCase();
      const res = await fetch(`${API}/users?userType=employee`);
      const data = await res.json();
      const filtered = data.filter(emp =>
        emp.fname.toLowerCase().includes(query) ||
        emp.lname.toLowerCase().includes(query) ||
        emp.designation.toLowerCase().includes(query)
      );
      const tbody = document.querySelector("#employeeTable tbody");
      tbody.innerHTML = filtered.map(emp => `
        <tr>
          <td>${emp.empId}</td>
          <td>${emp.fname} ${emp.lname}</td>
          <td>${emp.email}</td>
          <td>${emp.designation}</td>
          <td>${emp.age}</td>
          <td>
            <button class='btn btn-warning btn-sm me-1' onclick='editEmployee("${emp.id}")'>Edit</button>
            <button class='btn btn-danger btn-sm' onclick='confirmDelete("${emp.id}")'>Delete</button>
          </td>
        </tr>`).join("");             
    }

    function showPopup(message) {
      const modal = document.createElement("div");
      modal.className = "modal fade";
      modal.innerHTML = `
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Message</h5>
              <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">${message.replace(/\n/g, '<br>')}</div>
          </div>
        </div>`;
      document.body.appendChild(modal);
      new bootstrap.Modal(modal).show();
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
