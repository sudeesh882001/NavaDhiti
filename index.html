<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sticky Notes App</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f4f6f9;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .note {
        padding: 20px;
        border-radius: 10px;
        min-height: 140px;
        position: relative;
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        word-wrap: break-word;
        background-color: #fff;
        transition: transform 0.2s;
      }
      .note:hover {
        transform: scale(1.02);
      }
      .note-buttons {
        position: absolute;
        bottom: 15px;
        right: 15px;
      }
      .note-buttons button {
        margin-left: 8px;
      }
      .sticky-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
      }
      .form-section {
        background-color: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="text-center mb-5">
        <h1 class="fw-bold text-primary">Sudeesh Notes</h1>
        <p class="text-muted fs-5">Tracking my day to day work</p>
      </div>

      <div class="form-section mb-5">
        <label for="noteInput" class="form-label fw-semibold"
          >Enter a new note:</label
        >
        <textarea
          id="noteInput"
          class="form-control"
          rows="3"
          placeholder="Type something important..."
        ></textarea>
        <div class="text-end mt-3">
          <button class="btn btn-success px-4" onclick="addNote()">
            <i class="bi bi-plus-circle"></i> Add Note
          </button>
        </div>
      </div>

      <div id="notesContainer" class="sticky-container"></div>
    </div>

    <!-- Edit Note Modal -->
    <div
      class="modal fade"
      id="editModal"
      tabindex="-1"
      aria-labelledby="editModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="editModalLabel">Edit Note</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <textarea
              id="editNoteText"
              class="form-control"
              rows="4"
            ></textarea>
            <input type="hidden" id="editNoteId" />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="saveEditedNote()"
            >
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Delete Confirmation Modal -->
    <div
      class="modal fade"
      id="deleteModal"
      tabindex="-1"
      aria-labelledby="deleteModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="deleteModalLabel">Confirm Deletion</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            Are you sure you want to delete this note?
            <input type="hidden" id="deleteNoteId" />
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button
              type="button"
              class="btn btn-danger"
              onclick="confirmDelete()"
            >
              Yes, Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const colors = [
        "#fff3cd",
        "#cce5ff",
        "#d4edda",
        "#f8d7da",
        "#e2e3e5",
        "#f1f3f5",
      ];

      function getNotes() {
        return JSON.parse(localStorage.getItem("stickyNotes") || "[]");
      }

      function saveNotes(notes) {
        localStorage.setItem("stickyNotes", JSON.stringify(notes));
      }

      function addNote() {
        const text = document.getElementById("noteInput").value.trim();
        if (!text) return;

        const newNote = {
          id: Date.now(),
          text: text,
          color: colors[Math.floor(Math.random() * colors.length)],
        };

        const notes = getNotes();
        notes.push(newNote);
        saveNotes(notes);
        document.getElementById("noteInput").value = "";
        renderNotes();
      }

      function deleteNote(id) {
        document.getElementById("deleteNoteId").value = id;
        const modal = new bootstrap.Modal(
          document.getElementById("deleteModal")
        );
        modal.show();
      }

      function editNote(id) {
        const notes = getNo7tes();
        const note = notes.find((note) => note.id === id);
        if (note) {
          document.getElementById("editNoteText").value = note.text;
          document.getElementById("editNoteId").value = note.id;
          const modal = new bootstrap.Modal(
            document.getElementById("editModal")
          );
          modal.show();
        }
      }

      function saveEditedNote() {
        const id = Number(document.getElementById("editNoteId").value);
        const updatedText = document
          .getElementById("editNoteText")
          .value.trim();
        if (!updatedText) return;

        const notes = getNotes();
        const note = notes.find((note) => note.id === id);
        if (note) {
          note.text = updatedText;
          saveNotes(notes);
          renderNotes();
        }

        const modal = bootstrap.Modal.getInstance(
          document.getElementById("editModal")
        );
        modal.hide();
      }

      function renderNotes() {
        const notesContainer = document.getElementById("notesContainer");
        const notes = getNotes();
        notesContainer.innerHTML = "";

        notes.forEach((note) => {
          const noteDiv = document.createElement("div");
          noteDiv.className = "note";
          noteDiv.style.backgroundColor = note.color;
          noteDiv.innerHTML = `
          <div class="mb-4">${note.text}</div>
          <div class="note-buttons">
            <button class="btn btn-sm btn-outline-primary" onclick="editNote(${note.id})">
              <i class="bi bi-pencil-square"></i> Edit
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="deleteNote(${note.id})">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        `;
          notesContainer.appendChild(noteDiv);
        });
      }
      function confirmDelete() {
        const id = Number(document.getElementById("deleteNoteId").value);
        const notes = getNotes().filter((note) => note.id !== id);
        saveNotes(notes);
        renderNotes();

        const modal = bootstrap.Modal.getInstance(
          document.getElementById("deleteModal")
        );
        modal.hide();
      }

      window.onload = renderNotes;
    </script>
  </body>
</html>
